services:
  db:
    image: postgres:16-alpine
    container_name: taskmanagement-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-taskmanagement}
      POSTGRES_USER: ${POSTGRES_USER:-taskmanagement}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-taskmanagement}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-taskmanagement} -d ${POSTGRES_DB:-taskmanagement}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  db-data:
